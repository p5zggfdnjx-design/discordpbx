<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>SkypePBX // Matrix Login</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#eaf0f7;font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(440px,100%);background:#111823;border:1px solid #273244;border-radius:20px;padding:28px}.brand{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#8190a5}.box h1{margin:8px 0 8px;font-size:28px}.muted{color:#91a0b4;line-height:1.45}.oauth,button{width:100%;min-height:48px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}.oauth{display:grid;place-items:center;text-decoration:none;background:#5865f2;color:white;margin:22px 0 14px}hr{border:0;border-top:1px solid #273244;margin:20px 0}label{display:block;color:#a9b5c6;font-size:13px;margin:12px 0 6px}input{width:100%;height:46px;border:1px solid #344258;border-radius:10px;background:#0b111a;color:#fff;padding:0 12px;font-size:16px}button{margin-top:16px;background:#263244;color:#fff}.err{color:#ff9d9d;margin-top:12px;min-height:18px}.setup{display:block;text-align:center;margin-top:20px;color:#8fb5ff}
body{background:#020706;color:#eafff8;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background-image:linear-gradient(rgba(0,255,102,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,175,240,.025) 1px,transparent 1px),radial-gradient(circle at 50% -10%,rgba(0,175,240,.22),transparent 32rem);background-size:22px 22px,22px 22px,auto}.box{background:linear-gradient(180deg,rgba(7,20,16,.98),rgba(2,10,8,.98));border:1px solid #155140;border-radius:15px;box-shadow:0 0 45px rgba(0,175,240,.10),0 0 80px rgba(0,255,102,.05)}.brand{color:#00ff66;font:800 11px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:0 0 9px rgba(0,255,102,.25)}.box h1{color:#eaffff}.skypeMark{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:8px;border-radius:50% 43% 50% 45%;background:#00aff0;color:white;box-shadow:0 0 19px rgba(0,175,240,.35);font-size:24px}.muted{color:#7eaa9d}.oauth{background:linear-gradient(180deg,#10bdf5,#008ec5);box-shadow:0 0 20px rgba(0,175,240,.16)}hr{border-top-color:#14483b}label{color:#98c5b8}input{background:#020a08;border-color:#175141;color:#eafff8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}input:focus{outline:none;border-color:#00aff0;box-shadow:0 0 0 2px rgba(0,175,240,.15)}button{background:#0a2d22;border:1px solid #197053;color:#bfffd7}.setup{color:#00cfff}.err{color:#ff7492}
</style></head><body><main class="box"><div class="brand">SKYPEPBX // MATRIX GATEWAY</div><h1><span class="skypeMark">S</span> Operator Console</h1><p class="muted">Sign in with Discord or a PBX local account. Discord roles or local account permissions determine which workspaces and controls you can access.</p><a class="oauth" id="discordLogin" href="/auth/discord?return=/">Continue with Discord</a><hr><div class="muted">PBX local account / recovery administrator</div><form id="f"><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button id="localSignIn" type="submit">Sign in locally</button><div class="err" id="e"></div></form><a class="setup" href="/setup">First-run setup</a></main><script>(()=>{'use strict';const f=document.querySelector('#f'),e=document.querySelector('#e'),u=document.querySelector('#u'),p=document.querySelector('#p'),localBtn=document.querySelector('#localSignIn'),discordBtn=document.querySelector('#discordLogin');discordBtn.addEventListener('click',()=>{discordBtn.textContent='Opening Discord…';discordBtn.setAttribute('aria-busy','true')});f.addEventListener('submit',async ev=>{ev.preventDefault();if(localBtn.disabled)return;e.textContent='';localBtn.disabled=true;localBtn.textContent='Signing in…';try{const r=await fetch('/api/auth/local',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let j={};try{j=await r.json()}catch(_){j={}}if(!r.ok)throw Error(j.error||`Login failed (HTTP ${r.status})`);window.location.assign('/')}catch(err){e.textContent=err.message||'Login failed';localBtn.disabled=false;localBtn.textContent='Sign in locally'}});})();</script></body></html>
