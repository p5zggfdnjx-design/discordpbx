name: Validate DiscordPBX

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate shell and injected JavaScript
        shell: bash
        run: |
          bash -n bootstrap-update.sh bootstrap-managed-install.sh install-managed-updater.sh upgrade-from-current.sh updater/managed-update-agent.sh
          python - <<'PY'
          from pathlib import Path
          from runtime_hotfix import UPDATER_UI_SCRIPT
          from database_consolidation import _inject_online_users_ui

          updater_js = UPDATER_UI_SCRIPT.replace('<script id="pbx-updater-hotfix-v333">', '', 1).rsplit('</script>', 1)[0]
          Path('/tmp/discordpbx-updater-ui.js').write_text(updater_js, encoding='utf-8')

          html = _inject_online_users_ui('<html><body><section id="workspaces"></section></body></html>')
          marker = '<script id="pbx-online-users-script">'
          users_js = html.split(marker, 1)[1].split('</script>', 1)[0]
          Path('/tmp/discordpbx-online-users.js').write_text(users_js, encoding='utf-8')
          PY
          node --check /tmp/discordpbx-updater-ui.js
          node --check /tmp/discordpbx-online-users.js
      - name: Native voice lifecycle tests
        run: python -m unittest -v tests.test_voice_lifecycle_native
      - name: Replace stale voice client
        run: python -m unittest -v tests.test_inbound_reliability.VoiceRecoveryTests.test_stale_voice_client_is_discarded_before_inbound_connect
      - name: Retry transient voice connection
        run: python -m unittest -v tests.test_inbound_reliability.VoiceRecoveryTests.test_transient_voice_connect_failure_retries
      - name: Record no-route bridge failure
        run: python -m unittest -v tests.test_inbound_reliability.VoiceRecoveryTests.test_no_route_records_bridge_failure_and_cleans_pending
      - name: Inbound pending expiry tests
        run: python -m unittest -v tests.test_inbound_reliability.PendingRegistrationTests
      - name: Inbound routing fallback tests
        run: python -m unittest -v tests.test_inbound_reliability.RoutingFallbackTests
      - name: First-call voice tests
        run: python -m unittest -v tests.test_inbound_first_call
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
