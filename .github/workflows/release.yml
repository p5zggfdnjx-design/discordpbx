name: Publish DiscordPBX release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave blank to use config.py)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate updater scripts
        shell: bash
        run: |
          bash -n bootstrap-update.sh bootstrap-managed-install.sh install-managed-updater.sh upgrade-from-current.sh updater/managed-update-agent.sh
          python - <<'PY'
          from pathlib import Path
          from runtime_hotfix import UPDATER_UI_SCRIPT
          js = UPDATER_UI_SCRIPT.replace('<script id="pbx-updater-hotfix-v333">', '', 1).rsplit('</script>', 1)[0]
          Path('/tmp/discordpbx-updater-ui.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/discordpbx-updater-ui.js
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            INPUT_VERSION='${{ inputs.version }}'
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(python3 - <<'PY'
          import re
          s=open('config.py',encoding='utf-8').read()
          m=re.search(r'version\s*=\s*["\x27]([^"\x27]+)',s)
          print(m.group(1) if m else 'dev')
          PY
          )"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release ZIP
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          ROOT="discord-freepbx-bridge-v${VERSION}"
          mkdir -p "/tmp/${ROOT}"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            ./ "/tmp/${ROOT}/"
          cd /tmp
          zip -qr "${GITHUB_WORKSPACE}/discord-freepbx-bridge-v${VERSION}.zip" "${ROOT}"
          sha256sum "${GITHUB_WORKSPACE}/discord-freepbx-bridge-v${VERSION}.zip" > "${GITHUB_WORKSPACE}/discord-freepbx-bridge-v${VERSION}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "discord-freepbx-bridge-v${VERSION}.zip" \
              "discord-freepbx-bridge-v${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "discord-freepbx-bridge-v${VERSION}.zip" \
              "discord-freepbx-bridge-v${VERSION}.zip.sha256" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "DiscordPBX v${VERSION}"
          fi
      - name: Clean old releases from Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CURRENT="v${{ steps.version.outputs.version }}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r OLD_TAG; do
            [[ -n "$OLD_TAG" ]] || continue
            [[ "$OLD_TAG" == "$CURRENT" ]] && continue
            echo "Removing old release entry: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes
          done
          echo "Release page cleaned; retained $CURRENT"
