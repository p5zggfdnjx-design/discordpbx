services:
  discord-pbx:
    build: .
    container_name: discord-pbx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Legacy Asterisk AudioSocket fallback. Keep LAN-only; do not expose publicly.
      - "${AUDIOSOCKET_PORT:-9092}:${AUDIOSOCKET_PORT:-9092}/tcp"
      # Asterisk chan_websocket media for true wideband/HD audio. LAN-only.
      - "${MEDIA_WS_PORT:-9093}:${MEDIA_WS_PORT:-9093}/tcp"
      # HTML control panel. Put this behind NPM for HTTPS.
      - "${WEB_PORT:-8088}:${WEB_PORT:-8088}/tcp"
    volumes:
      - ./assets:/app/assets:ro
      - ./data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${WEB_PORT:-8088}/api/setup/status', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
